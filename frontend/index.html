<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SafeYatra - hazard-aware route planner for Chamoli, Uttarakhand" />
    <title>SafeYatra</title>
    <script>
      // apply the saved theme before first paint (avoids a flash)
      try {
        var t = localStorage.getItem('safeyatra-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
